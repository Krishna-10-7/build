# On the VM: cp .env.example .env, fill in keys, then
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  shoplite:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["npm", "run", "shoplite"]
    environment:
      SHOPLITE_PORT: "4100"
    ports: ["8100:4100"]
    restart: unless-stopped
    mem_limit: 256m

  sentinel:
    build: { context: .., dockerfile: deploy/Dockerfile }
    command: ["npm", "run", "server"]
    env_file: ../.env
    environment:
      TARGET_URL: http://shoplite:4100
      BASELINE_URL: http://shoplite:4100
      SENTINEL_PORT: "4200"
      PW_CHANNEL: ""
      WORKERS: "4"
    volumes:
      - sentinel-data:/app/data
      - ../tickets:/app/tickets:ro
    depends_on: [shoplite]
    restart: unless-stopped
    # Four Chromium workers fit comfortably; leaves room on a 16 GB machine for benchmark sweeps.
    mem_limit: 4g
    shm_size: 1g

  caddy:
    image: caddy:2.8
    ports: ["80:80", "443:443"]
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      SITE: ${SITE:-:80}
    depends_on: [sentinel]
    restart: unless-stopped

volumes:
  sentinel-data:
  caddy-data:
